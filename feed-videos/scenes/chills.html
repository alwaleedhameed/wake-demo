<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=DM+Sans:wght@600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#ffe9d6}
  canvas{position:absolute;inset:0}
  .t{position:absolute;left:96px;right:96px;opacity:0;font-family:Unbounded,sans-serif;font-weight:800;color:#2a0e4a;line-height:1}
  .l{position:absolute;font-family:'DM Sans',sans-serif;font-weight:600;font-size:26px;color:#2a0e4a;background:#fff;padding:8px 16px;border-radius:999px;opacity:0}
</style></head><body>
<canvas id="c" width="720" height="1280"></canvas>
<div class="t" id="hook" style="top:130px;font-size:70px">Chills from a song?</div>
<div class="t" id="mtl" style="top:140px;font-size:72px">2001,<br>Montreal</div>
<div class="t" id="rew" style="top:130px;font-size:64px">Same reward circuits as food</div>
<div class="t" id="yours" style="top:150px;font-size:80px">What's yours?</div>
<div class="l" id="l1" style="left:110px;top:610px">ventral striatum</div>
<div class="l" id="l2" style="right:110px;top:700px">midbrain</div>
<div class="l" id="l3" style="left:130px;top:860px">orbitofrontal cortex</div>
<script src="../words/chills.js"></script>
<script src="common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const ctx = $("c").getContext("2d");
const T = { mtl: at("2001"), brain: at("brain"), rew: at("reward"), so: at("So"), yours: at("what's"), end: WORDS.duration };
const COLORS = ["#ff6b9a", "#ffb200", "#7b5cff", "#19c3a0"];

function draw(t) {
  ctx.fillStyle = "#ffe9d6"; ctx.fillRect(0, 0, 720, 1280);
  // Soft colour blobs breathing, like a lava lamp.
  for (let i = 0; i < 4; i++) {
    const x = 360 + Math.cos(t * 0.6 + i * 1.7) * 230, y = 760 + Math.sin(t * 0.5 + i * 2.1) * 320, r = 260 + 40 * Math.sin(t * 1.3 + i);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, COLORS[i] + "99"); g.addColorStop(1, COLORS[i] + "00");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 720, 1280);
  }
  // Equaliser bars pulse with a steady beat until the brain appears.
  const eq = 1 - prog(t, T.brain - 0.3, 0.5);
  if (eq > 0) for (let i = 0; i < 14; i++) {
    const h = (80 + 260 * Math.abs(Math.sin(t * 4 + i * 0.7) * Math.sin(t * 1.3 + i))) * eq;
    ctx.fillStyle = COLORS[i % 4]; ctx.beginPath(); ctx.roundRect(70 + i * 42, 900 - h, 28, h, 14); ctx.fill();
  }
  // "Goosebumps": dots that pop up on the word chills.
  const gb = prog(t, at("shivers"), 0.8) * (1 - prog(t, T.mtl, 0.4));
  for (let i = 0; i < 60 && gb > 0; i++) {
    ctx.fillStyle = "#2a0e4a"; ctx.globalAlpha = gb * rand(i + 4);
    ctx.beginPath(); ctx.arc(rand(i) * 720, 420 + rand(i + 1) * 700, 3 + rand(i + 2) * 5 * gb, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // A simple brain outline with three glowing reward regions.
  const b = ease(prog(t, T.brain - 0.2, 0.6)) * (1 - prog(t, T.so, 0.5));
  if (b > 0) {
    ctx.save(); ctx.globalAlpha = b; ctx.translate(360, 760); ctx.scale(b, b);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#2a0e4a"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.ellipse(0, 0, 250, 190, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-40, -185); ctx.bezierCurveTo(-10, -80, -60, 20, 10, 190); ctx.stroke();
    [[-120, -20, 0], [70, 60, 1], [-60, 110, 2]].forEach(([x, y, i]) => {
      const p = 0.6 + 0.4 * Math.sin(t * 6 + i);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 80 * p); g.addColorStop(0, COLORS[i]); g.addColorStop(1, COLORS[i] + "00");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 80 * p, 0, 7); ctx.fill();
    });
    ctx.restore();
  }
  // A big heart for "it's a reward".
  const h = ease(prog(t, at("reward", 2), 0.5)) * (1 - prog(t, T.yours, 0.4));
  if (h > 0) { ctx.save(); ctx.translate(360, 760); ctx.scale(h * 7, h * 7); ctx.fillStyle = "#ff6b9a"; ctx.beginPath();
    ctx.moveTo(0, 12); ctx.bezierCurveTo(-30, -10, -12, -32, 0, -18); ctx.bezierCurveTo(12, -32, 30, -10, 0, 12); ctx.fill(); ctx.restore(); }

  show($("hook"), t, 0, T.mtl - 0.1, { dy: 0, scale: 1.3 });
  show($("mtl"), t, T.mtl, T.brain - 0.1);
  ["l1", "l2", "l3"].forEach((id, i) => show($(id), t, T.brain + 0.5 + i * 0.25, T.so - 0.1, { scale: 1.4 }));
  show($("rew"), t, T.rew, T.so - 0.1);
  show($("yours"), t, T.yours - 0.2, T.end + 1, { dy: 0, scale: 1.4 });
}
</script></body></html>
